# Dr. Nam H. Le. drnamlabs.com, bunnyquant.com
# App BunnyQuant (khách hàng) viết bằng Swift thuần. Sinh project: `xcodegen` trong thư mục này (BunnyQuant.xcodeproj không vào git).
name: BunnyQuant
options:
  bundleIdPrefix: com.bunnyquant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9FX23J6S62
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    BQ_API_BASE: https://bunnyquant.com/api
targets:
  BunnyQuant:
    type: application
    platform: iOS
    sources: [BunnyQuant]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bunnyquant.app
        PRODUCT_NAME: BunnyQuant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BunnyQuant/Info.plist
        CODE_SIGN_ENTITLEMENTS: BunnyQuant/BunnyQuant.Release.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: BunnyQuant/BunnyQuant.Debug.entitlements
